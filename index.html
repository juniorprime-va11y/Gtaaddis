<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA Addis: Southside Stories — M1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #game-canvas { display: block; width: 100%; height: 100%; }
    #ui-root {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; font-family: system-ui, sans-serif; color: #fff;
    }
    #fps-overlay {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.65); padding: 6px 10px; border-radius: 4px;
      font-size: 12px; line-height: 1.4; white-space: pre; pointer-events: none;
    }
    #fps-overlay.budget-exceeded { background: rgba(120,0,0,0.8); }
    #hud {
      position: absolute; bottom: 16px; left: 16px;
      background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-root">
    <div id="fps-overlay">Initializing…</div>
    <div id="hud">Health: 100 | Money: 0 | Objective: —</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
